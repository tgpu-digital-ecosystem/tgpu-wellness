name: Import original TGPU Wellness website (one-time)
on:
  push:
    branches: [main]
    paths: [.github/workflows/import-wellness.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dedicated Wellness repository
        uses: actions/checkout@v4
        with:
          path: wellness
          persist-credentials: true
      - name: Checkout original TGPU ecosystem repository read-only
        uses: actions/checkout@v4
        with:
          repository: MamduhSaffin/tgpu-ecosystem
          ref: main
          path: original
          persist-credentials: false
      - name: Copy only the Wellness site and its approved assets
        shell: bash
        run: |
          set -euo pipefail
          test -f original/src/legacy-site/wellness/index.html
          grep -Fq 'TGPU Wellness' original/src/legacy-site/wellness/index.html
          test -s 'original/public/wellness/assets/TGPU Wellness Green Gold Logo.png'
          test -s 'original/public/wellness/assets/TGPU Wellness_ Learn, Practise, Live Well.png'
          mkdir -p wellness/public wellness/source-archive
          cp -a original/src/legacy-site/wellness/. wellness/public/
          cp -a original/public/wellness/. wellness/source-archive/public-wellness/
          cp -a original/public/wellness/assets/. wellness/public/assets/
          cp 'original/public/wellness/assets/TGPU Wellness Green Gold Logo.png' wellness/public/tgpu-wellness-logo.png
          cp 'original/public/wellness/assets/TGPU Wellness_ Learn, Practise, Live Well.png' wellness/public/tgpu-wellness-social-banner.png
          # Azure-only settings belong in source archive; they are not a Cloudflare static asset.
          mv wellness/public/staticwebapp.config.json wellness/source-archive/staticwebapp.config.json
          python3 - <<'PY'
          from pathlib import Path
          p = Path("wellness/public/index.html")
          s = p.read_text(encoding="utf-8")
          assert "<title>TGPU Wellness" in s and "https://wellness.tgpu.my/" in s
          s = s.replace("/316C4FDA-FD9C-4A29-B81D-640997BABE7E.png", "/tgpu-wellness-logo.png")
          s = s.replace("https://wellness.tgpu.my/58768678-4C3C-48EB-A8E0-BAE311691041.png", "https://wellness.tgpu.my/tgpu-wellness-social-banner.png")
          s = s.replace('content="TGPU Wellness — Wellness. Care. Balance."', 'content="TGPU Wellness — Learn, Practise, Live Well"')
          s = s.replace('<meta property="og:image:width" content="1536">', '')
          s = s.replace('<meta property="og:image:height" content="864">', '')
          p.write_text(s, encoding="utf-8")
          assert 'https://wellness.tgpu.my/tgpu-wellness-social-banner.png' in s
          assert 'href="/tgpu-wellness-logo.png"' in s
          PY
          node --check wellness/public/tgpu-feedback.js
          test -s wellness/public/tgpu-wellness-logo.png
          test -s wellness/public/tgpu-wellness-social-banner.png
          test -s wellness/public/robots.txt
          test -s wellness/public/sitemap.xml
      - name: Commit imported files to dedicated repository
        shell: bash
        working-directory: wellness
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public source-archive
          if git diff --cached --quiet; then
            echo "Wellness files already imported."
          else
            git commit -m "Import complete standalone Wellness website and approved assets"
            git push origin HEAD:main
          fi
